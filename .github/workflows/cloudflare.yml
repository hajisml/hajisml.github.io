name: Deploy to Cloudflare Pages

# Builds the Astro site and uploads it (plus functions/) to Cloudflare Pages.
# Each branch gets its own URL: <branch>.<project>.pages.dev; the project's
# production branch is served at <project>.pages.dev.
on:
  push:
    branches: [astroworld]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'halim' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          SITE_URL: https://${{ vars.CF_PAGES_PROJECT || 'halim' }}.pages.dev
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - name: Deploy
        run: npx wrangler pages deploy dist --project-name="$CF_PROJECT" --branch="${GITHUB_REF_NAME}" --commit-hash="${GITHUB_SHA}" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
